    <!-- Eyes and Pupils (37 to 48) with high-intensity amber cores -->
    <g fill="#fbbf24">
      <!-- Left Eye -->
      <circle cx="340" cy="440" r="3.5" fill="#55b9ff" />
      <circle cx="365" cy="425" r="3.5" fill="#55b9ff" />
      <circle cx="400" cy="425" r="3.5" fill="#55b9ff" />
      <circle cx="430" cy="445" r="3.5" fill="#55b9ff" />
      <circle cx="395" cy="455" r="3.5" fill="#55b9ff" />
