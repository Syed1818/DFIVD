  <!-- Technical Telemetry HUD Bracket Overlays -->
  <g stroke="#55b9ff" stroke-width="1.5" opacity="0.75" font-family="'DM Mono', monospace">
    <!-- Orbital Target Brackets -->
    <path d="M 330 400 L 310 400 L 310 480 L 330 480" />
    <path d="M 435 400 L 455 400 L 455 480 L 435 480" />
    <text x="310" y="390" fill="#55b9ff" font-size="12" letter-spacing="1">ROI_EYE_L // 0.998</text>

    <path d="M 545 400 L 525 400 L 525 480 L 545 480" />
    <path d="M 670 400 L 690 400 L 690 480 L 670 480" />
    <text x="545" y="390" fill="#55b9ff" font-size="12" letter-spacing="1">ROI_EYE_R // 0.994</text>

    <!-- Face Bounding Rect (SSD Standard) -->
    <rect x="220" y="140" width="560" height="730" rx="8" stroke="#55b9ff" stroke-dasharray="8 6" stroke-width="1" opacity="0.4" />
    <text x="230" y="170" fill="#fbbf24" font-size="13" font-weight="600" letter-spacing="2">CAFFE_SSD: [X:220, Y:140, W:560, H:730]</text>
    <text x="230" y="190" fill="#67f5b0" font-size="11" letter-spacing="1.5">LANDMARKS: 68_POINT_DENSE // REGISTERED</text>
  </g>
</svg>
