      <!-- Right Eye -->
      <circle cx="570" cy="445" r="3.5" fill="#55b9ff" />
      <circle cx="600" cy="425" r="3.5" fill="#55b9ff" />
      <circle cx="635" cy="425" r="3.5" fill="#55b9ff" />
      <circle cx="660" cy="440" r="3.5" fill="#55b9ff" />
      <circle cx="635" cy="455" r="3.5" fill="#55b9ff" />
      <circle cx="605" cy="455" r="3.5" fill="#55b9ff" />
      <circle cx="618" cy="440" r="6" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" /> <!-- Right Pupil Center -->
    </g>

    <!-- Nose Bridge & Tip (28 to 36) -->
    <g fill="#67f5b0">
      <circle cx="500" cy="410" r="3.5" />
      <circle cx="500" cy="460" r="3.5" />
      <circle cx="500" cy="510" r="3.5" />
      <circle cx="500" cy="560" r="4.5" />
