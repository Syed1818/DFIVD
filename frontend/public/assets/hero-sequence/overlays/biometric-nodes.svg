<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <defs>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 68-Point Caffe-SSD Forensic Landmark Nodes -->
  <g filter="url(#nodeGlow)">
    <!-- Jawline points (1 to 17) -->
    <g fill="#55b9ff">
      <circle cx="270" cy="550" r="4.5" />
      <circle cx="280" cy="620" r="4.5" />
      <circle cx="310" cy="700" r="4.5" />
      <circle cx="345" cy="740" r="4.5" />
      <circle cx="390" cy="770" r="4.5" />
      <circle cx="425" cy="805" r="4.5" />
      <circle cx="460" cy="830" r="5" />
      <circle cx="500" cy="840" r="6" fill="#fbbf24" />
      <circle cx="540" cy="830" r="5" />
      <circle cx="575" cy="805" r="4.5" />
      <circle cx="610" cy="770" r="4.5" />
      <circle cx="655" cy="740" r="4.5" />
      <circle cx="690" cy="700" r="4.5" />
      <circle cx="720" cy="620" r="4.5" />
      <circle cx="730" cy="550" r="4.5" />
