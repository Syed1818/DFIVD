      <circle cx="420" cy="670" r="4" />
      <circle cx="450" cy="660" r="4" />
      <circle cx="480" cy="655" r="4" />
      <circle cx="500" cy="658" r="4.5" fill="#fbbf24" />
      <circle cx="520" cy="655" r="4" />
      <circle cx="550" cy="660" r="4" />
      <circle cx="580" cy="670" r="4" />
      <circle cx="550" cy="700" r="4" />
      <circle cx="520" cy="715" r="4" />
      <circle cx="500" cy="718" r="4.5" fill="#fbbf24" />
