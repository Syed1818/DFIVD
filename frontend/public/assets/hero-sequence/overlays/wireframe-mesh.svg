<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55b9ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Delaunay Facial Wireframe Triangulation (Normalized to 1000x1000) -->
  <g stroke="url(#cyanGlow)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonBlur)" opacity="0.85">
    <!-- Forehead & Cranial Arc -->
    <path d="M 320 220 L 500 160 L 680 220 L 620 290 L 500 270 L 380 290 Z" />
    <path d="M 500 160 L 500 270 M 320 220 L 500 270 M 680 220 L 500 270" />
    <path d="M 280 320 L 380 290 L 500 270 L 620 290 L 720 320" />
    <path d="M 280 320 L 360 360 L 500 340 L 640 360 L 720 320" />
    
    <!-- Brow & Temples -->
    <path d="M 360 360 L 430 380 L 500 340 M 640 360 L 570 380 L 500 340" />
    <path d="M 280 320 L 260 420 L 340 430 L 360 360" />
    <path d="M 720 320 L 740 420 L 660 430 L 640 360" />

    <!-- Orbital Eye Rings (Denser Mesh) -->
    <!-- Left Eye Mesh -->
    <polygon points="340,430 390,410 440,430 430,460 380,470 340,450" />
    <line x1="390" y1="410" x2="380" y2="470" />
    <line x1="340" y1="430" x2="440" y2="430" />
    <polygon points="370,435 410,435 390,455" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Right Eye Mesh -->
    <polygon points="660,430 610,410 560,430 570,460 620,470 660,450" />
    <line x1="610" y1="410" x2="620" y2="470" />
    <line x1="660" y1="430" x2="560" y2="430" />
    <polygon points="630,435 590,435 610,455" stroke="#ffffff" stroke-width="1.5" />

    <!-- Glabella & Nasal Bridge -->
    <path d="M 440 430 L 500 390 L 560 430 L 500 480 Z" />
    <line x1="500" y1="390" x2="500" y2="480" />
    <path d="M 500 480 L 470 560 L 500 580 L 530 560 Z" />
    <path d="M 440 430 L 470 560 M 560 430 L 530 560" />
    
    <!-- Nose Tip & Nostrils -->
    <polygon points="460,590 500,610 540,590 500,580" />
    <path d="M 430 580 L 460 590 L 470 620 L 500 610 L 530 620 L 540 590 L 570 580" />

    <!-- Cheeks & Maxilla -->
    <path d="M 260 420 L 270 550 L 360 530 L 340 450" />
    <path d="M 740 420 L 730 550 L 640 530 L 660 450" />
    <path d="M 360 530 L 430 580 L 440 660 L 350 630 Z" />
    <path d="M 640 530 L 570 580 L 560 660 L 650 630 Z" />

    <!-- Mouth & Lips Complex -->
    <path d="M 420 670 L 500 650 L 580 670 L 550 710 L 500 720 L 450 710 Z" />
    <line x1="420" y1="670" x2="580" y2="670" stroke="#55b9ff" stroke-width="1.8" />
    <path d="M 450 670 L 500 690 L 550 670" />

    <!-- Mandible & Chin -->
    <path d="M 270 550 L 310 700 L 390 770 L 460 830 L 500 840 L 540 830 L 610 770 L 690 700 L 730 550" />
    <path d="M 390 770 L 450 710 L 500 720 L 550 710 L 610 770" />
    <path d="M 460 830 L 500 770 L 540 830" />
    <line x1="500" y1="720" x2="500" y2="770" />

    <!-- Submental & Neck Struts -->
    <path d="M 460 830 L 420 920 L 500 950 L 580 920 L 540 830" />
    <line x1="500" y1="840" x2="500" y2="950" />
  </g>
</svg>
